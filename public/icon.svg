<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="vinko-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284C7"/>
      <stop offset="45%" stop-color="#0D9488"/>
      <stop offset="100%" stop-color="#0F766E"/>
    </linearGradient>
    <linearGradient id="flame-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F59E0B"/>
      <stop offset="100%" stop-color="#EF4444"/>
    </linearGradient>
  </defs>

  <!-- Squircle con fondo degradado de alta definición -->
  <rect x="2" y="2" width="60" height="60" rx="16" fill="url(#vinko-bg)"/>
  <rect x="2" y="2" width="60" height="60" rx="16" fill="none" stroke="#FFFFFF" stroke-width="1.5" stroke-opacity="0.35"/>

  <!-- Emblema de Cohete / Lanzador Clínico Vinko -->
  <g transform="translate(14, 14) scale(1.5)">
    <!-- Llama de propulsión con toque cálido -->
    <path
      d="M4.5 16.5c-1.5 1.26-2 5-2 5s3.74-.5 5-2c.71-.84.7-2.13-.09-2.91a2.18 2.18 0 0 0-2.91-.09z"
      fill="url(#flame-grad)"
      stroke="#FFFFFF"
      stroke-width="1.8"
      stroke-linecap="round"
      stroke-linejoin="round"
    />
    <!-- Cuerpo del cohete -->
    <path
      d="m12 15-3-3a22 22 0 0 1 2-3.95A12.88 12.88 0 0 1 22 2c0 2.72-.78 7.5-6 11a22.35 22.35 0 0 1-4 2z"
      fill="#FFFFFF"
      fill-opacity="0.22"
      stroke="#FFFFFF"
      stroke-width="2.2"
      stroke-linecap="round"
      stroke-linejoin="round"
    />
    <!-- Aletas estabilizadoras -->
    <path
      d="M9 12H4s.55-3.03 2-4c1.62-1.08 5 0 5 0"
      fill="none"
      stroke="#FFFFFF"
      stroke-width="2.2"
      stroke-linecap="round"
      stroke-linejoin="round"
    />
    <path
      d="M12 15v5s3.03-.55 4-2c1.08-1.62 0-5 0-5"
      fill="none"
      stroke="#FFFFFF"
      stroke-width="2.2"
      stroke-linecap="round"
      stroke-linejoin="round"
    />
  </g>
</svg>
